<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Login — Historinha do Sono</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--night:#232358;--night-deep:#141334;--night-soft:#33327a;--moon:#FFD98E;--paper:#FFF9EF;--ink:#38325c;--lilac:#B8A7E8;--rose:#F5A3B7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,var(--night-deep),var(--night-soft));color:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,249,239,.06);border:1.5px solid rgba(255,249,239,.16);border-radius:22px;padding:36px 30px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
h1{font-family:'Fraunces',serif;font-size:1.5rem;text-align:center;margin-bottom:6px;color:var(--moon)}
.sub{text-align:center;color:var(--lilac);font-size:.85rem;margin-bottom:26px;font-weight:600}
label{display:block;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lilac);margin:14px 0 6px}
input{width:100%;background:rgba(255,249,239,.08);border:2px solid rgba(255,249,239,.2);color:var(--paper);border-radius:14px;padding:14px 16px;font-size:1rem;font-family:inherit;font-weight:600}
input:focus{outline:none;border-color:var(--moon)}
.btn{width:100%;background:linear-gradient(180deg,#ffe3a8,var(--moon));color:#4a3a12;font-weight:800;font-size:1rem;padding:15px;border:none;border-radius:999px;cursor:pointer;margin-top:20px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.google{background:#fff;color:#444;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.btn.ghost{background:transparent;color:var(--lilac);border:1.5px solid rgba(184,167,232,.4);margin-top:12px}
.toggle{text-align:center;margin-top:20px;font-size:.9rem;color:rgba(255,249,239,.7)}
.toggle a{color:var(--moon);cursor:pointer;font-weight:800;text-decoration:underline}
.msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:.88rem;font-weight:600;text-align:center;display:none}
.msg.err{background:rgba(245,163,183,.15);border:1px solid rgba(245,163,183,.4);color:#ffd0da;display:block}
.msg.ok{background:rgba(143,211,199,.15);border:1px solid rgba(143,211,199,.4);color:#c7f0e8;display:block}
.divider{text-align:center;margin:18px 0;color:rgba(255,249,239,.35);font-size:.8rem;font-weight:700}
.logged{text-align:center}
.logged .avatar{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4d8,var(--moon));margin:0 auto 16px}
.credits{font-family:'Fraunces',serif;font-size:2.4rem;font-weight:700;color:var(--moon);margin:8px 0}
.small{font-size:.82rem;color:rgba(255,249,239,.5);margin-top:16px;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <h1>☾ Historinha do Sono</h1>
  <p class="sub" id="sub">Entre para criar as histórias do seu filho</p>

  <!-- FORM -->
  <div id="authForm">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="mínimo 6 caracteres" autocomplete="current-password">
    <button class="btn" id="mainBtn" onclick="submitAuth()">Entrar</button>
    <button class="btn google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.3 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.5c-.5 2.9-2.2 5.3-4.7 7l7.2 5.6c4.2-3.9 6.6-9.6 6.6-16.6z"/><path fill="#FBBC05" d="M10.4 28.3c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.8-6.1C.9 15.9 0 19.8 0 24s.9 8.1 2.6 11.4l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.2-5.6c-2 1.4-4.6 2.2-8 2.2-6.4 0-11.7-3.8-13.6-9.3l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continuar com Google
    </button>
    <div class="toggle" id="toggle">
      Não tem conta? <a onclick="toggleMode()">Cadastre-se</a>
    </div>
  </div>

  <!-- LOGADO -->
  <div id="loggedView" class="logged" style="display:none">
    <div class="avatar"></div>
    <p id="userEmail" style="font-weight:800"></p>
    <div class="credits" id="creditsNum">—</div>
    <p style="color:var(--lilac);font-weight:700">créditos de história</p>
    <button class="btn ghost" onclick="logout()">Sair</button>
    <p class="small" id="debugInfo"></p>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
// ==== CONFIGURAÇÃO SUPABASE ====
const SUPABASE_URL = "https://hhmiuclkivzwznrvfbfg.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhobWl1Y2xraXZ6d3pucnZmYmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTkyMTcsImV4cCI6MjEwMTI3NTIxN30.6UdMpFr__7kbaBQzy5EFV44it5jsRjtRlxDaG23UcxA";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let modo = "login"; // ou "cadastro"

function toggleMode() {
  modo = modo === "login" ? "cadastro" : "login";
  document.getElementById("mainBtn").textContent = modo === "login" ? "Entrar" : "Criar conta";
  document.getElementById("sub").textContent = modo === "login"
    ? "Entre para criar as histórias do seu filho"
    : "Crie sua conta e ganhe 1 história grátis";
  document.getElementById("toggle").innerHTML = modo === "login"
    ? 'Não tem conta? <a onclick="toggleMode()">Cadastre-se</a>'
    : 'Já tem conta? <a onclick="toggleMode()">Entrar</a>';
  showMsg("", "");
}

function showMsg(txt, tipo) {
  const m = document.getElementById("msg");
  m.textContent = txt;
  m.className = "msg" + (tipo ? " " + tipo : "");
}

async function submitAuth() {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  if (!email || !senha) { showMsg("Preencha e-mail e senha.", "err"); return; }
  showMsg("Aguarde...", "ok");

  if (modo === "cadastro") {
    const { data, error } = await sb.auth.signUp({ email, password: senha });
    if (error) { showMsg("Erro: " + error.message, "err"); return; }
    showMsg("Conta criada! Verifique seu e-mail se pedir confirmação.", "ok");
    checarSessao();
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) { showMsg("Erro: " + error.message, "err"); return; }
    showMsg("", "");
    checarSessao();
  }
}

async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.href }
  });
  if (error) showMsg("Erro Google: " + error.message, "err");
}

async function logout() {
  await sb.auth.signOut();
  checarSessao();
}

async function checarSessao() {
  const { data: { session } } = await sb.auth.getSession();
  const form = document.getElementById("authForm");
  const logged = document.getElementById("loggedView");
  if (session) {
    form.style.display = "none";
    logged.style.display = "block";
    document.getElementById("userEmail").textContent = session.user.email;
    // busca os créditos no banco
    const { data: perfil, error } = await sb
      .from("perfis").select("creditos, assinante, plano").eq("id", session.user.id).single();
    if (error) {
      document.getElementById("creditsNum").textContent = "?";
      document.getElementById("debugInfo").textContent = "Erro ao ler perfil: " + error.message;
    } else {
      document.getElementById("creditsNum").textContent = perfil.creditos;
      document.getElementById("debugInfo").textContent =
        `plano: ${perfil.plano} · assinante: ${perfil.assinante} · id: ${session.user.id.slice(0,8)}...`;
    }
  } else {
    form.style.display = "block";
    logged.style.display = "none";
  }
}

// ao carregar, verifica se já está logado (inclusive volta do Google)
checarSessao();
sb.auth.onAuthStateChange(() => checarSessao());
</script>
</body>
</html>
